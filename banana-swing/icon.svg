  <path d="M226 -4 Q220 24 200 42" stroke="#2f6e1c" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M30 -4 Q36 24 56 42" stroke="#5fae36" stroke-width="4" fill="none" stroke-linecap="round"/>
