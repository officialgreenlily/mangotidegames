<!doctype html><html lang="en"><head><title>Mango Tide Games</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#FFF4E0;--ink:#4A2A0E;--soft:#7A5A3A;--link:#1B7FA0;--orange:#E0701F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22170D;--ink:#FFF4E0;--soft:#D9C2A5;--link:#6CC7E3;--orange:#FF9A4D}}
:root[data-theme="dark"]{--bg:#22170D;--ink:#FFF4E0;--soft:#D9C2A5;--link:#6CC7E3;--orange:#FF9A4D}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px 64px}
a{color:var(--link)}h1{font-size:30px;line-height:1.2;margin:.2em 0}h2{font-size:20px;margin:1.6em 0 .3em;color:var(--orange)}
p{margin:.6em 0}.date{color:var(--soft);font-size:15px}.back{font-size:15px}
.home{text-align:center;padding-top:12vh}.home img{width:150px;height:150px}.home p{color:var(--soft)}
footer{margin-top:48px;font-size:15px;color:var(--soft)}
</style></head><body><main class="home">
<img src="/logo.svg" alt="Mango Tide Games logo">
<h1>Mango Tide Games</h1>
<p>Makers of Banana Swing, coming soon to iPhone.</p>
<p>Help and questions: <a href="mailto:support@mangotidegames.com">support@mangotidegames.com</a></p>
<footer><a href="/privacy/">Privacy Policy</a></footer>
</main></body></html>
